<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Control Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black text-blue-400 tracking-wider">⚡ HERMES</h1>
            <span class="bg-gray-700 text-xs px-2 py-1 rounded text-gray-300">v2.0 Multi-Pool</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-400">Stato Motore:</span>
            <span id="status-badge" class="px-3 py-1 rounded text-sm font-bold bg-red-500/20 text-red-400 border border-red-500/30">OFFLINE 🔴</span>
        </div>
    </header>

    <!-- BODY: Sidebar + Main -->
    <div class="flex flex-1 overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-80 bg-gray-800 p-6 flex flex-col border-r border-gray-700 overflow-y-auto">

            <!-- Sezione: Configurazione Avvio -->
            <h3 class="text-lg font-bold text-gray-200 mb-4 border-b border-gray-700 pb-2">Configurazione Avvio</h3>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Max Workers (Pool Default)</label>
                    <input type="number" id="workers" value="4"
                        class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Poll Interval (sec)</label>
                    <input type="number" id="interval" value="15"
                        class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-blue-500 outline-none transition">
                </div>
                <button onclick="startHermes()" id="btn-start"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-0.5">
                    ▶ Avvia Motore
                </button>
                <button onclick="stopHermes()" id="btn-stop" disabled
                    class="w-full bg-gray-700 text-gray-500 font-bold py-3 rounded cursor-not-allowed transition">
                    ■ Arresta Sistema
                </button>
            </div>

            <!-- Sezione: Aggiungi Pool -->
            <h3 class="text-lg font-bold text-gray-200 mb-4 mt-2 border-b border-gray-700 pb-2">Gestione Multi-Pool</h3>
            <div class="space-y-3 bg-gray-900/50 p-4 rounded border border-gray-700 mb-4">
                <input type="text" id="new-pool-name" placeholder="Nome pool (es. pool_llama)"
                    class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white outline-none focus:border-emerald-500 transition">
                <input type="number" id="new-pool-workers" placeholder="Num. Workers (es. 2)"
                    class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white outline-none focus:border-emerald-500 transition">
                <button onclick="addPool()" id="btn-add-pool" disabled
                    class="w-full bg-gray-700 text-gray-500 text-sm font-bold py-2 rounded opacity-50 cursor-not-allowed">
                    + Aggiungi Pool
                </button>
            </div>

        </aside>

        <!-- MAIN -->
        <main class="flex-1 flex flex-col p-6 bg-gray-900 overflow-y-auto gap-6">

            <!-- Griglia Pool -->
            <div>
                <h2 class="text-xl font-bold mb-4 text-gray-200">Thread Pools Attivi</h2>
                <div id="pools-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex items-center justify-center text-gray-500 col-span-full">
                        Avvia Hermes per visualizzare i Pool...
                    </div>
                </div>
            </div>

            <!-- Terminale Log -->
            <div class="flex flex-col flex-1 min-h-0">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <h2 class="text-xl font-bold text-gray-200">Log di Sistema</h2>
                    <!-- Toolbar download -->
                    <div class="flex flex-wrap items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2">
                        <span class="text-xs text-gray-400 whitespace-nowrap">Esporta:</span>
                        <div class="flex items-center gap-1">
                            <label class="text-xs text-gray-500">Da</label>
                            <input type="datetime-local" id="log-start"
                                class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-300 outline-none focus:border-blue-500 transition">
                        </div>
                        <div class="flex items-center gap-1">
                            <label class="text-xs text-gray-500">A</label>
                            <input type="datetime-local" id="log-end"
                                class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-300 outline-none focus:border-blue-500 transition">
                        </div>
                        <button onclick="downloadLogs()"
                            class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded transition flex items-center gap-1">
                            ⬇ Scarica .txt
                        </button>
                        <button onclick="clearTerminal()"
                            class="bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs px-3 py-1 rounded transition">
                            🗑 Pulisci
                        </button>
                    </div>
                </div>
                <div id="terminal-container" class="flex-1 bg-black rounded-lg border border-gray-700 p-4 font-mono text-sm overflow-y-auto shadow-inner min-h-0">
                    <div id="terminal-output" class="text-green-400 whitespace-pre-wrap pb-8"></div>
                </div>
            </div>

        </main>
    </div>

    <script src="/static/js/app.js" defer></script>
</body>
</html>
