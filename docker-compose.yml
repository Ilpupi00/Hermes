services:
  # --- IL DATABASE POSTGRESQL ---
  db:
    image: postgres:16-alpine
    container_name: hermes_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Persistenza dei dati del DB (se spegni il container, i dati restano)
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- IL MOTORE HERMES (AI SCHEDULER & DASHBOARD) ---
  hermes:
    build: .
    container_name: hermes_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Puntano al container 'db' invece che a 'localhost'
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_INFERENCE_PROVIDER=${HF_INFERENCE_PROVIDER:-featherless-ai}
      # Configurazione delle cartelle per i CSV
      - HERMES_DATA_ROOT=/app/data
      - HERMES_POLL_INTERVAL=${HERMES_POLL_INTERVAL:-60}
      - HERMES_CHUNK_SIZE=${HERMES_CHUNK_SIZE:-1000}
      - HERMES_MAX_WORKERS=${HERMES_MAX_WORKERS:-4}
      - HERMES_MAX_RETRIES=${HERMES_MAX_RETRIES:-3}
      - HERMES_ORPHAN_GRACE_SECONDS=${HERMES_ORPHAN_GRACE_SECONDS:-300}
      - HERMES_WORKER_CLASS=${HERMES_WORKER_CLASS:-src.workers.hybrid_worker.HybridWorker}
      - HERMES_AI_BASE_URL=${HERMES_AI_BASE_URL:-http://localhost:8000/v1}
    volumes:
      # Un solo mount garantisce rename atomici fra le sottocartelle e può
      # essere condiviso con hermes-webapp tramite lo stesso path host.
      - ${HERMES_DATA_ROOT:-./data}:/app/data
      - ./src:/app/src
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
